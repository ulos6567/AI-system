# T075 — Nginx 리버스 프록시 (운영 도메인 p12.sumzip.com)
#   Backend 9532 / Frontend 정적 9512
#   SSE 채널은 proxy_buffering off + proxy_read_timeout 1h (research.md R-002)

upstream backend_api {
  server backend:9532;
  keepalive 32;
}

upstream frontend_static {
  server frontend:9512;
  keepalive 16;
}

# Gzip
gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
gzip_min_length 1024;

server {
  listen 80;
  listen [::]:80;
  server_name p12.sumzip.com;

  client_max_body_size 10m;

  # 운영 환경에서는 ALB/Let's Encrypt 가 443 종단을 담당.
  # 본 컨테이너는 80 만 노출하고, 외부 LB 또는 docker 측 reverse-proxy 에서 TLS 처리 권장.

  # SSE 스트림: 버퍼링/캐시/압축 비활성화 + 긴 read timeout
  location ~ ^/api/.*/events/stream$ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding on;
    add_header X-Accel-Buffering no;
  }

  # OpenAPI 도구 (dev only — 운영에서는 백엔드가 자체적으로 차단)
  location = /api/docs {
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
  }
  location = /api/docs.json {
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
  }

  # 일반 API
  location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA 라우팅: 정적 파일 없으면 index.html 로 폴백
  location / {
    proxy_pass http://frontend_static;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
