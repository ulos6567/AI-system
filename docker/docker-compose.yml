services:
  mariadb:
    image: mariadb:11
    container_name: mis2601-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MARIADB_DATABASE: ${DB_NAME:-ai_store_ops}
      MARIADB_USER: ${DB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: mis2601-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_HOST: mariadb
      NODE_ENV: production
      PORT: "9532"
      PUBLIC_DOMAIN: p12.sumzip.com
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "9532"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: mis2601-frontend
    restart: unless-stopped
    expose:
      - "9512"

  nginx:
    image: nginx:1.27-alpine
    container_name: mis2601-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mariadb-data:
